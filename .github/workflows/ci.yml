name: DotNet

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - run: make build

      - run: make test

      - name: Push NuGet
        if: |
          github.event.action == 'published'
        run: make push-nuget
        env:
          TOKEN: ${{ secrets.NUGET_API_KEY }}
